<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Voting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">MUWADAAH</p>
      <h1>Hasil Voting</h1>
      <p class="subtitle">Rekap pilihan desain dekorasi.</p>
    </header>

    <section class="card">
      <div id="results" class="results">Memuat hasil...</div>
    </section>

    <footer>
      <a href="index.html">← Kembali ke voting</a>
    </footer>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwQcyiGUnVjIveJ6LEpxF8y7RyryMGUZUz7gVpfbMm1hO0k_cGSYi9BfatPynDCccHB/exec";

    async function loadResults() {
      const box = document.getElementById("results");
      try {
        const res = await fetch(API_URL + "?action=hasil");
        const data = await res.json();

        if (!data.success) throw new Error(data.message || "Gagal memuat hasil.");

        if (!data.results.length) {
          box.textContent = "Belum ada suara.";
          return;
        }

        box.innerHTML = data.results.map(item => `
          <div class="result-row">
            <div>
              <strong>${escapeHtml(item.nama)}</strong>
              <span>${item.suara} suara</span>
            </div>
            <div class="bar-wrap">
              <div class="bar" style="width:${item.persen}%"></div>
            </div>
            <b>${item.persen}%</b>
          </div>
        `).join("");
      } catch (err) {
        box.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[c]));
    }

    loadResults();
  </script>
</body>
</html>
