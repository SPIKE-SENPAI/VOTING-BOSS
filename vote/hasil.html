<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24221c">
  <title>Hasil Voting — Muwadaah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain"></div>
  <main class="container results-page">
    <header class="hero">
      <div class="ornament top-mark" aria-hidden="true"><span></span><i>✦</i><span></span></div>
      <p class="eyebrow">DHIRASATYA</p>
      <h1>Hasil<br><em>Voting</em></h1>
      <div class="gold-rule" aria-hidden="true"><b></b><span>✦</span><b></b></div>
      <p class="subtitle">Rekap pilihan desain yang telah masuk.</p>
    </header>

    <section class="intro-note result-intro">
      <span class="note-number">01</span>
      <div>
        <small>REKAP SUARA</small>
        <h2>Desain pilihan kita</h2>
        <p>Data ditampilkan berdasarkan suara yang tercatat.</p>
      </div>
    </section>

    <section class="card results-card">
      <div id="results" class="results">Memuat hasil...</div>
    </section>

    <footer>
      <div class="footer-mark">MUWADAAH 24-27</div>
      <a href="index.html">← Kembali ke voting</a>
    </footer>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwQcyiGUnVjIveJ6LEpxF8y7RyryMGUZUz7gVpfbMm1hO0k_cGSYi9BfatPynDCccHB/exec";

    async function loadResults() {
      const box = document.getElementById("results");
      try {
        const res = await fetch(API_URL + "?action=hasil");
        const data = await res.json();

        if (!data.success) throw new Error(data.message || "Gagal memuat hasil.");

        if (!data.results.length) {
          box.textContent = "Belum ada suara.";
          return;
        }

        box.innerHTML = data.results.map((item, index) => `
          <div class="result-row">
            <div class="result-top">
              <span class="result-rank">0${index + 1}</span>
              <div class="result-name">
                <strong>${escapeHtml(item.nama)}</strong>
                <span>${item.suara} suara</span>
              </div>
              <b>${item.persen}%</b>
            </div>
            <div class="bar-wrap">
              <div class="bar" style="width:${item.persen}%"></div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        box.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[c]));
    }

    loadResults();
  </script>
</body>
</html>
