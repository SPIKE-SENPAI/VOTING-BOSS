<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voting Desain Kelulusan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">MUWADAAH</p>
      <h1>Voting Desain Dekorasi Kelulusan</h1>
      <p class="subtitle">Cari nama kamu, lalu pilih satu desain yang paling kamu sukai.</p>
    </header>

    <section class="card">
      <h2>1. Cari nama kamu</h2>
      <label for="nameSearch">Nama lengkap</label>
      <input id="nameSearch" type="text" autocomplete="off"
             placeholder="Ketik nama kamu..." maxlength="80">
      <div id="searchResults" class="search-results"></div>
      <div id="selectedVoter" class="selected-voter hidden"></div>
    </section>

    <section id="designSection" class="card hidden">
      <h2>2. Pilih desain</h2>
      <p class="hint">Klik salah satu gambar untuk memilih.</p>
      <div id="designGrid" class="design-grid"></div>
    </section>

    <button id="voteButton" class="vote-button" disabled>Kirim Pilihan</button>
    <p id="message" class="message"></p>

    <footer>
      <a href="hasil.html">Hasil voting</a>
    </footer>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3>Konfirmasi pilihan</h3>
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button id="cancelButton" class="secondary">Batal</button>
        <button id="confirmButton" class="primary">Ya, Kirim</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
